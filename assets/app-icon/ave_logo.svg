<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Subtle Outer Border Glow -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3" />
    </linearGradient>

    <!-- Vibrant AVE Gradient: Electric Cyan to Vivid Indigo -->
    <linearGradient id="primary-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Dynamic Playhead Accent: Warm Gold to Coral -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Timeline Track Gradient -->
    <linearGradient id="track-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#rim)" stroke-width="3" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#0284C7" opacity="0.08" filter="url(#glow)" />
  <circle cx="340" cy="220" r="120" fill="#818CF8" opacity="0.08" filter="url(#glow)" />

  <!-- Main AVE Vector Mark -->
  <g filter="url(#shadow)">
    <!-- The "A" & "V" Interlocking Ribbon Geometry -->
    <!-- Left Ascender of 'A' -->
    <path d="M 112 368 L 224 136 C 228 128 238 124 246 128 C 255 132 258 142 254 150 L 176 368 C 172 378 160 384 150 380 C 140 376 134 364 138 354 Z"
          fill="url(#primary-grad)" />

    <!-- Right Descender of 'V' -->
    <path d="M 234 136 L 314 354 C 318 364 314 376 304 380 C 294 384 282 378 278 368 L 210 180 Z"
          fill="url(#primary-grad)" opacity="0.9" />

    <!-- Horizontal Bridge of 'A' / Leading Cut Blade -->
    <path d="M 152 284 L 272 284 C 280 284 286 278 286 270 C 286 262 280 256 272 256 L 166 256 Z"
          fill="#FFFFFF" opacity="0.95" />

    <!-- The Kinetic Center Playhead '▶' -->
    <path d="M 238 214 C 238 206 246 201 254 205 L 328 250 C 335 254 335 264 328 268 L 254 313 C 246 317 238 312 238 304 Z"
          fill="url(#accent-grad)" />

    <!-- The 'E' Timeline Tracks (Audio, Video, Effects) -->
    <!-- Track 1 (Top / Graphic Layer) -->
    <rect x="340" y="196" width="68" height="18" rx="9" fill="url(#track-grad)" />
    <!-- Track 2 (Middle / Cut Active Layer) -->
    <rect x="354" y="247" width="76" height="18" rx="9" fill="url(#primary-grad)" />
    <!-- Track 3 (Bottom / Base Audio Track) -->
    <rect x="340" y="298" width="60" height="18" rx="9" fill="url(#track-grad)" opacity="0.8" />
  </g>

  <!-- Clean Precision Branding Subtitle 'AVE' at Bottom -->
  <text x="256" y="442"
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="28"
        font-weight="800"
        letter-spacing="12"
        fill="#94A3B8">AVE</text>
</svg>
